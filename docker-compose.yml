services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      AVS_IMAGE_ENGINE: diffusers
      # Photoreal SDXL (4-8 steps). For the fast low-quality draft model use stabilityai/sd-turbo.
      AVS_IMAGE_MODEL_ID: SG161222/RealVisXL_V5.0_Lightning
      AVS_IMAGE_DEVICE: auto
      AVS_IMAGE_MODEL_CACHE_DIR: /app/models
      # Wan2.1 T2V 1.3B (Apache-2.0). Weights (~29 GB) live in the same models volume; set to none to turn video off.
      AVS_VIDEO_ENGINE: wan
      AVS_CORS_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "8003:8000"
    volumes:
      - backend-models:/app/models
      - backend-outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Fetches missing weights on start; if that fails (e.g. offline) the API still starts with what is cached.
    command: sh -c "python scripts/download_model.py --yes || echo 'Model download skipped; using cached weights.'; exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Text-to-speech: Chatterbox Multilingual (MIT). Own container: its torch/transformers/diffusers pins conflict with
  # the backend. Loads its model only while speaking and frees the GPU afterwards.
  speech:
    build: ./speech
    image: ai_video-gen-speech
    volumes:
      # Code is mounted so edits do not need an image rebuild (the image only carries the heavy libraries).
      - ./speech:/app
      - backend-outputs:/outputs
      - speech-models:/models
      - speech-voices:/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Lip-sync: MuseTalk 1.5 (MIT). Own container (torch 2.0 + OpenMMLab). Each request runs in a child process,
  # so the GPU memory is returned when it finishes.
  lipsync:
    build: ./lipsync
    image: ai_video-gen-lipsync
    volumes:
      - ./lipsync:/service
      - backend-outputs:/outputs
      - lipsync-models:/musetalk/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8003
    ports:
      - "3001:3000"
    volumes:
      # Read-write: next dev writes next-env.d.ts (git-ignored) on start and hangs on a read-only mount.
      - .:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next

volumes:
  backend-models:
  backend-outputs:
  speech-models:
  speech-voices:
  lipsync-models:
  frontend-node-modules:
  frontend-next-cache:
