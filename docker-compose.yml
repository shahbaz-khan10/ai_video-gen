services:
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      AVS_IMAGE_ENGINE: diffusers
      # Photoreal SDXL (4-8 steps). For the fast low-quality draft model use stabilityai/sd-turbo.
      AVS_IMAGE_MODEL_ID: SG161222/RealVisXL_V5.0_Lightning
      AVS_IMAGE_DEVICE: auto
      AVS_IMAGE_MODEL_CACHE_DIR: /app/models
      # Wan2.1 T2V 1.3B (Apache-2.0). Weights (~29 GB) live in the same models volume; set to none to turn video off.
      AVS_VIDEO_ENGINE: wan
      AVS_CORS_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
      # Lip-sync engine: LatentSync 1.5 (clearer sync, keeps the beard/face). http://lipsync:8020 = MuseTalk 1.5.
      AVS_LIPSYNC_URL: http://latentsync:8020
    ports:
      - "8003:8000"
    volumes:
      - backend-models:/app/models
      - ${AVS_DATA_DIR:-C:/ai-studio-data}/outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Fetches missing weights on start; if that fails (e.g. offline) the API still starts with what is cached.
    command: sh -c "python scripts/download_model.py --yes || echo 'Model download skipped; using cached weights.'; exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Text-to-speech: Chatterbox Multilingual (MIT). Own container: its torch/transformers/diffusers pins conflict with
  # the backend. Loads its model only while speaking and frees the GPU afterwards.
  speech:
    build: ./speech
    restart: unless-stopped
    image: ai_video-gen-speech
    volumes:
      # Code is mounted so edits do not need an image rebuild (the image only carries the heavy libraries).
      - ./speech:/app
      - ${AVS_DATA_DIR:-C:/ai-studio-data}/outputs:/outputs
      - speech-models:/models
      - ${AVS_DATA_DIR:-C:/ai-studio-data}/voices:/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Lip-sync: MuseTalk 1.5 (MIT). Own container (torch 2.0 + OpenMMLab). Each request runs in a child process,
  # so the GPU memory is returned when it finishes.
  lipsync:
    build: ./lipsync
    restart: unless-stopped
    image: ai_video-gen-lipsync
    volumes:
      - ./lipsync:/service
      - ${AVS_DATA_DIR:-C:/ai-studio-data}/outputs:/outputs
      - lipsync-models:/musetalk/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Lip-sync: LatentSync 1.5 (ByteDance, Apache-2.0), same API as `lipsync` (MuseTalk). The backend uses it through
  # AVS_LIPSYNC_URL. Weights live in the latentsync-models volume and are fetched on start when missing.
  latentsync:
    build: ./latentsync
    restart: unless-stopped
    image: ai_video-gen-latentsync
    command: sh -c "sh /service/download_weights.sh || echo 'Weight download failed; using what is cached.'; exec uvicorn app:app --app-dir /service --host 0.0.0.0 --port 8020"
    volumes:
      - ./latentsync:/service
      - ${AVS_DATA_DIR:-C:/ai-studio-data}/outputs:/outputs
      - latentsync-models:/latentsync/checkpoints
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Audio-driven talking video: OmniAvatar 1.3B (Apache-2.0) on Wan2.1-T2V-1.3B. Animates any character from an image
  # and a voice (animals and cartoons too), unlike the face-only lip-sync services above.
  # Experimental: not started by `docker compose up` (needs `--profile experimental`). Run beside the backend it took
  # 17.6 GB RAM + all 8 GB VRAM and the backend failed with "Server out of memory"; it joins the backend's GPU lock in
  # Phase 6 (docs/STORAGE_AND_GPU.md).
  omniavatar:
    profiles: ["experimental"]
    build: ./omniavatar
    restart: unless-stopped
    image: ai_video-gen-omniavatar
    volumes:
      - ./omniavatar:/service
      - ${AVS_DATA_DIR:-C:/ai-studio-data}/outputs:/outputs
      - omniavatar-models:/omniavatar/pretrained_models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    image: node:22-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8003
    ports:
      - "3001:3000"
    volumes:
      # Read-write: next dev writes next-env.d.ts (git-ignored) on start and hangs on a read-only mount.
      - .:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next

# Model weights (~124 GB) live in external volumes: `docker compose down -v` cannot delete them. On a new machine
# create them once with `docker volume create <name>` (docs/STORAGE_AND_GPU.md). Recorded voices and outputs are
# small and live in ${AVS_DATA_DIR:-C:/ai-studio-data} so they are visible in Windows and survive any volume loss.
volumes:
  backend-models:
    external: true
    name: ai_video-gen_backend-models
  speech-models:
    external: true
    name: ai_video-gen_speech-models
  lipsync-models:
    external: true
    name: ai_video-gen_lipsync-models
  latentsync-models:
    external: true
    name: ai_video-gen_latentsync-models
  omniavatar-models:
    external: true
    name: ai_video-gen_omniavatar-models
  # Rebuildable caches (npm ci / next dev recreate them).
  frontend-node-modules:
  frontend-next-cache:
